<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>誤差考察ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
/* レイアウト：方眼ノートの上で、上に進行表示、中央に会話、下に入力欄が固定された1画面アプリ */
:root {
  --paper: #f7f8f6;
  --grid: #e3e8e4;
  --ink: #1d2a26;
  --ink-soft: #55635e;
  --line: #cfd8d3;
  --surface: #ffffff;
  --ai: #eef4f1;
  --accent: #c2186f;        /* 解析アプリの打点の色 */
  --accent-ink: #ffffff;
  --accent-soft: #fbe3ef;
  --board: #2f4a40;         /* 黒板の緑 */
  --board-ink: #f0f5f2;
  --danger: #b3261e;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a18; --grid: #1e2623; --ink: #e4ebe7; --ink-soft: #9aa9a3; --line: #2f3a36;
    --surface: #1b2320; --ai: #1f2b27; --accent: #f06aa8; --accent-ink: #1a0b12; --accent-soft: #3a1f2c;
    --board: #24392f; --board-ink: #e4efe9; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a18; --grid: #1e2623; --ink: #e4ebe7; --ink-soft: #9aa9a3; --line: #2f3a36;
  --surface: #1b2320; --ai: #1f2b27; --accent: #f06aa8; --accent-ink: #1a0b12; --accent-soft: #3a1f2c;
  --board: #24392f; --board-ink: #e4efe9; --danger: #ff8a80; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }  /* display を指定した要素でも hidden で必ず隠す */
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-width: 820px;
  margin: 0 auto;
}

/* 上部：黒板色のヘッダーと進行表示 */
header {
  background: var(--board);
  color: var(--board-ink);
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 10px;
}
.head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head-row h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25rem;
  margin: 0;
  letter-spacing: 0.04em;
}
.head-row .sub { font-size: 0.8rem; opacity: 0.8; }
.head-actions { margin-left: auto; display: flex; gap: 8px; }
.ghost {
  font: inherit; font-size: 0.8rem;
  color: var(--board-ink);
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--board-ink) 40%, transparent);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
}
.ghost:hover { background: color-mix(in srgb, var(--board-ink) 12%, transparent); }
.ghost.warn { border-color: var(--accent); color: var(--board-ink); background: color-mix(in srgb, var(--accent) 35%, transparent); }

.steps {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  counter-reset: step;
}
.steps li {
  font-size: 0.68rem;
  line-height: 1.3;
  text-align: center;
  padding-top: 18px;
  position: relative;
  opacity: 0.55;
}
.steps li::before {
  content: "";
  position: absolute; top: 6px; left: 0; right: 0;
  height: 6px; border-radius: 3px;
  background: color-mix(in srgb, var(--board-ink) 25%, transparent);
}
.steps li.done { opacity: 0.85; }
.steps li.done::before { background: color-mix(in srgb, var(--board-ink) 70%, transparent); }
.steps li.now { opacity: 1; font-weight: 700; }
.steps li.now::before { background: var(--accent); }
@media (max-width: 520px) {
  .steps li { font-size: 0; padding-top: 12px; }
  .steps li.now { font-size: 0.72rem; grid-column: span 1; white-space: nowrap; overflow: visible; }
}

/* 中央：会話 */
main {
  overflow-y: auto;
  padding-block: 20px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.msg.user { flex-direction: row-reverse; }
.avatar {
  flex: none;
  width: 38px; height: 38px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--board);
  color: var(--board-ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.8rem;
}
.bubble {
  min-width: 0;
  max-width: min(640px, 100%);
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--ai);
  border: 1px solid var(--line);
  overflow-wrap: anywhere;
}
.msg.ai .bubble { border-top-left-radius: 4px; }
.msg.user .bubble {
  background: var(--surface);
  border-color: var(--accent);
  border-top-right-radius: 4px;
}
.name { font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 2px; }
.bubble p { margin: 0 0 0.6em; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 0.3em 0 0.6em; padding-left: 1.4em; }
.bubble strong { color: var(--accent); }
.bubble code { font-family: var(--font-mono); font-size: 0.9em; }
.bubble img { display: block; max-width: 100%; max-height: 360px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 6px; }
.table-wrap { overflow-x: auto; margin: 0.4em 0 0.8em; }
.bubble table { border-collapse: collapse; font-size: 0.9rem; min-width: 100%; }
.bubble th, .bubble td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.bubble th { background: var(--board); color: var(--board-ink); font-weight: 700; white-space: nowrap; }
.bubble td { background: var(--surface); font-variant-numeric: tabular-nums; }
.bubble.error { background: var(--surface); border-color: var(--danger); color: var(--danger); }
.typing span {
  display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%;
  background: var(--ink-soft); animation: blink 1.2s infinite both;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.6; } }

/* 下部：入力欄 */
footer {
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-top: 10px;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 8px;
}
.attach-preview { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--ink-soft); }
.attach-preview img { height: 56px; border-radius: 6px; border: 1px solid var(--line); }
.attach-preview button { font: inherit; font-size: 0.8rem; background: none; border: none; color: var(--danger); cursor: pointer; text-decoration: underline; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea {
  flex: 1; min-width: 0;
  font: inherit; line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  resize: none;
  max-height: 180px;
}
.composer textarea:focus-visible, button:focus-visible, .icon-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn {
  flex: none;
  display: grid; place-items: center;
  width: 46px; height: 46px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  font-size: 0.7rem;
  line-height: 1.1;
  text-align: center;
}
.icon-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.send {
  flex: none;
  font: inherit; font-weight: 700;
  height: 46px; padding: 0 18px;
  border: none; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink);
  cursor: pointer;
}
.send:disabled { opacity: 0.45; cursor: default; }
.hint { font-size: 0.75rem; color: var(--ink-soft); margin: 0; }
/* 最初の名前入力 */
.modal-bg {
  position: fixed; inset: 0; z-index: 10;
  background: color-mix(in srgb, var(--board) 55%, transparent);
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modal {
  width: min(440px, 100%);
  background: var(--surface); color: var(--ink);
  border-radius: 16px; border: 1px solid var(--line);
  padding: 22px 22px 18px;
  display: grid; gap: 14px;
}
.modal h2 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }
.modal p { margin: 0; font-size: 0.85rem; color: var(--ink-soft); }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal label { display: grid; gap: 4px; font-size: 0.85rem; font-weight: 700; }
.modal input {
  font: inherit; font-weight: 400; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%;
}
.modal .err { color: var(--danger); font-size: 0.85rem; margin: 0; }
.modal .send { width: 100%; }
.who { font-size: 0.8rem; opacity: 0.9; }

/* レポートの下書き */
.report-card {
  margin: 8px 0;
  border: 1px dashed var(--accent);
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 12px 14px;
  display: grid; gap: 8px;
}
.report-card .title { font-family: var(--font-display); font-weight: 700; }
.report-card .send { justify-self: start; height: 40px; }
.report-card p { margin: 0; font-size: 0.85rem; color: var(--ink-soft); }

.code-gate { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
.code-gate input { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); width: 10em; }
.code-gate button { font: inherit; padding: 6px 14px; border-radius: 8px; border: none; background: var(--board); color: var(--board-ink); cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-row">
      <h1>誤差考察ラボ</h1>
      <span class="sub">実験A 自由落下 × AIくん</span>
      <div class="head-actions">
        <button class="ghost who" id="who" type="button" title="名前を直す"></button>
        <button class="ghost" id="save-log" type="button">会話を保存</button>
        <button class="ghost" id="reset" type="button">最初からやり直す</button>
      </div>
    </div>
    <ol class="steps" id="steps" aria-label="進み具合">
      <li>① g を確認</li>
      <li>② 誤差(%)</li>
      <li>③ 誤差の種類</li>
      <li>④ 主要因</li>
      <li>⑤ 他の要因</li>
      <li>⑥ まとめ表</li>
      <li>⑦ レポート</li>
    </ol>
  </header>

  <main id="log" aria-live="polite"></main>

  <footer>
    <form class="code-gate" id="code-gate" hidden>
      <label for="class-code">クラスコード</label>
      <input id="class-code" autocomplete="off" inputmode="latin">
      <button type="submit">設定</button>
    </form>
    <div class="attach-preview" id="attach-preview" hidden>
      <img id="attach-img" alt="添付する画像">
      <span>この画像を送ります</span>
      <button type="button" id="attach-clear">取り消す</button>
    </div>
    <form class="composer" id="composer">
      <label class="icon-btn" title="画像を添付">
        <input type="file" id="file" accept="image/*">
        <span>画像<br>添付</span>
      </label>
      <textarea id="input" rows="1" placeholder="AIくんに返事を書く"></textarea>
      <button class="send" id="send" type="submit">送信</button>
    </form>
    <p class="hint">AIくんは答えを全部は教えません。考えたことをそのまま書いてみよう。会話はこの端末に保存されます。</p>
  </footer>
</div>

<div class="modal-bg" id="profile-modal" hidden>
  <form class="modal" id="profile-form" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <h2 id="profile-title">はじめに、きみのことを教えてね</h2>
    <div class="row">
      <label for="p-cluster">クラスター（アルファベット）
        <input id="p-cluster" maxlength="2" autocomplete="off" autocapitalize="characters" placeholder="例 B" required>
      </label>
      <label for="p-number">番号
        <input id="p-number" type="number" inputmode="numeric" min="1" max="99" placeholder="例 12" required>
      </label>
    </div>
    <label for="p-name">名前
      <input id="p-name" maxlength="30" autocomplete="name" placeholder="例 物理 太郎" required>
    </label>
    <label for="p-code">クラスコード（先生から聞いたもの）
      <input id="p-code" autocomplete="off" autocapitalize="off">
    </label>
    <p>入力した名前とAIくんとのやりとりは、先生が学習の様子を確かめるために読みます。レポートにも名前が入ります。</p>
    <p class="err" id="p-err" hidden></p>
    <button class="send" type="submit">はじめる</button>
  </form>
</div>

<script>
// ===== 設定 =====
// デプロイした Cloudflare Worker の URL に書き換える
const WORKER_URL = "https://gosa-chat.fujinaka-phys.workers.dev/chat";
const STORAGE_KEY = "gosa-chat-v2";
const MAX_IMAGE_SIDE = 1568;

const GREETING =
  "こんにちは、AIくんだよ。実験おつかれさま！\n\n" +
  "これから、きみの実験の**誤差**を一緒に考えていこう。まずは、動画解析アプリの「画像を共有・保存」で保存した" +
  "**自由落下（実験A）の分析画像**を、左下の「画像添付」からアップロードしてね。";

// ===== 状態 =====
// apiMessages: Claude API に送る会話そのもの（AIくんの返信は thinking ブロックも含めて丸ごと保存し、そのまま送り返す）
// view: 画面に表示する会話
let state = { apiMessages: [], view: [], step: 1, classCode: "", student: null, sessionId: "", report: "" };
let pendingImage = null; // { dataUrl, mediaType, base64 }
let busy = false;

const $ = (id) => document.getElementById(id);
const logEl = $("log");

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch {}
}
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {
    // 容量不足など。画像を外して保存を試みる
    try {
      const slim = { ...state, view: state.view.map((v) => ({ ...v, image: null })) };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
    } catch {}
  }
}

// ===== 表示 =====
const STEP_RE = /\[\[STEP:(\d)\]\]/g;
const REPORT_RE = /```report\s*\n([\s\S]*?)```/;
const REPORT_MARK = "\n\n%%REPORT%%\n\n";
function stripControl(text) {
  return text
    .replace(STEP_RE, "")
    .replace(REPORT_RE, REPORT_MARK)
    .replace(/```report[\s\S]*$/, "\n\n（レポートの下書きを作っています…）")
    .replace(/\[\[[^\]]*$/, "")
    .trimEnd();
}
function renderMarkdown(text) {
  const html = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("table").forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });
  return tmp.innerHTML;
}
function bubble(role, { text = "", image = null, error = false } = {}) {
  const row = document.createElement("div");
  row.className = "msg " + (role === "ai" ? "ai" : "user");
  if (role === "ai") {
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "AI";
    av.setAttribute("aria-hidden", "true");
    row.appendChild(av);
  }
  const b = document.createElement("div");
  b.className = "bubble" + (error ? " error" : "");
  if (role === "ai" && !error) {
    const n = document.createElement("div");
    n.className = "name";
    n.textContent = "AIくん";
    b.appendChild(n);
  }
  if (image) {
    const img = document.createElement("img");
    img.src = image;
    img.alt = "送った画像";
    b.appendChild(img);
  }
  const body = document.createElement("div");
  body.className = "body";
  if (role === "ai" && !error) setAiBody(body, text);
  else body.textContent = text;
  b.appendChild(body);
  row.appendChild(b);
  logEl.appendChild(row);
  return body;
}
// AIくんの返信を描画する。```report ブロックはダウンロード用のカードに置き換える
function setAiBody(el, raw) {
  const report = REPORT_RE.exec(raw)?.[1] ?? null;
  const [before, after = ""] = stripControl(raw).split("%%REPORT%%");
  el.innerHTML = renderMarkdown(before);
  if (report !== null) {
    el.appendChild(reportCard(report));
    if (after.trim()) el.insertAdjacentHTML("beforeend", renderMarkdown(after));
  }
}
function reportCard(report) {
  const card = document.createElement("div");
  card.className = "report-card";
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = "レポートの下書きができたよ";
  const note = document.createElement("p");
  note.textContent = "Word形式（.docx）で保存されます。Pages や Word で開いて、記入欄を自分の言葉で埋めよう。書き終えたらPDFで書き出して提出してね。";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "send";
  btn.textContent = "レポートをダウンロード";
  btn.addEventListener("click", () => downloadReport(report, btn));
  card.append(title, note, btn);
  return card;
}

function scrollDown() {
  logEl.scrollTop = logEl.scrollHeight;
}
function renderSteps() {
  [...$("steps").children].forEach((li, i) => {
    li.className = i + 1 < state.step ? "done" : i + 1 === state.step ? "now" : "";
  });
}
function renderAll() {
  logEl.innerHTML = "";
  bubble("ai", { text: GREETING });
  for (const v of state.view) bubble(v.role, v);
  renderSteps();
  scrollDown();
}

// ===== 画像 =====
async function prepareImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = url;
    });
    const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
    pendingImage = { dataUrl, mediaType: "image/jpeg", base64: dataUrl.split(",")[1] };
    $("attach-img").src = dataUrl;
    $("attach-preview").hidden = false;
    updateSend();
  } catch {
    showError("画像を読み込めませんでした。別の画像で試してください。");
  } finally {
    URL.revokeObjectURL(url);
  }
}
function clearImage() {
  pendingImage = null;
  $("attach-preview").hidden = true;
  $("file").value = "";
  updateSend();
}

// ===== 送信 =====
function updateSend() {
  $("send").disabled = busy || (!$("input").value.trim() && !pendingImage);
}
function showError(message) {
  bubble("ai", { text: message, error: true });
  scrollDown();
}

async function send() {
  const text = $("input").value.trim();
  if (busy || (!text && !pendingImage)) return;
  if (!state.student) { openProfile(); return; }

  const content = [];
  if (pendingImage) {
    content.push({ type: "image", source: { type: "base64", media_type: pendingImage.mediaType, data: pendingImage.base64 } });
  }
  content.push({ type: "text", text: text || "（画像を送ります）" });

  const userView = { role: "user", text: text || "（画像を送りました）", image: pendingImage?.dataUrl || null };
  const restore = { text, image: pendingImage };
  state.apiMessages.push({ role: "user", content });
  bubble("user", userView);
  $("input").value = "";
  autoGrow();
  clearImage();

  busy = true;
  updateSend();
  const aiBody = bubble("ai");
  aiBody.innerHTML = '<span class="typing" aria-label="AIくんが考え中"><span></span><span></span><span></span></span>';
  scrollDown();

  let streamed = "";
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ classCode: state.classCode, sessionId: state.sessionId, student: state.student, messages: state.apiMessages }),
    });
    if (!res.ok) {
      let msg = "AIくんに接続できませんでした。";
      try { msg = (await res.json()).error || msg; } catch {}
      if (res.status === 401) $("code-gate").hidden = false;
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let final = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const ev = /^event: (.+)$/m.exec(chunk)?.[1];
        const dataLine = /^data: (.*)$/m.exec(chunk)?.[1];
        if (!ev || dataLine == null) continue;
        const data = JSON.parse(dataLine);
        if (ev === "delta") {
          streamed += data.text;
          setAiBody(aiBody, streamed);
          scrollDown();
        } else if (ev === "done") {
          final = data;
        } else if (ev === "error") {
          throw new Error(data.message);
        }
      }
    }
    if (!final) throw new Error("返信が途中で切れました。もう一度送ってください。");

    const fullText = final.content.filter((b) => b.type === "text").map((b) => b.text).join("");
    const steps = [...fullText.matchAll(STEP_RE)];
    if (steps.length) state.step = Math.max(state.step, Number(steps[steps.length - 1][1]));
    const kept = fullText.replace(STEP_RE, "").trimEnd();
    setAiBody(aiBody, kept);
    const report = REPORT_RE.exec(fullText)?.[1];
    if (report) state.report = report;

    state.apiMessages.push({ role: "assistant", content: final.content });
    state.view.push(userView, { role: "ai", text: kept });
    renderSteps();
    save();
  } catch (err) {
    // 失敗した送信は会話から取り除き、入力欄に戻す
    state.apiMessages.pop();
    aiBody.closest(".msg").remove();
    logEl.lastElementChild?.remove();
    showError(err.message || "エラーが起きました。");
    $("input").value = restore.text;
    autoGrow();
    if (restore.image) {
      pendingImage = restore.image;
      $("attach-img").src = restore.image.dataUrl;
      $("attach-preview").hidden = false;
    }
  } finally {
    busy = false;
    updateSend();
    scrollDown();
  }
}

// ===== 会話ログの保存（レポートの下書き用） =====
function saveLog() {
  const who = state.student ? `1年 ${state.student.cluster}クラスター ${state.student.number}番 ${state.student.name}` : "";
  const lines = ["# 誤差考察ラボ 会話ログ", "", who, `保存日時: ${new Date().toLocaleString("ja-JP")}`, ""];
  lines.push("**AIくん:** " + GREETING, "");
  for (const v of state.view) {
    lines.push(`**${v.role === "ai" ? "AIくん" : "わたし"}:** ${v.image ? "［画像］ " : ""}${v.text}`, "");
  }
  const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `誤差考察ログ_${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ===== イベント =====
function autoGrow() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px";
}
$("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("input").addEventListener("input", () => { autoGrow(); updateSend(); });
$("input").addEventListener("keydown", (e) => {
  // PCでは Ctrl/⌘+Enter で送信。日本語変換中の Enter は無視
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); send(); }
});
$("input").addEventListener("paste", (e) => {
  const file = [...(e.clipboardData?.files || [])].find((f) => f.type.startsWith("image/"));
  if (file) { e.preventDefault(); prepareImage(file); }
});
$("file").addEventListener("change", (e) => prepareImage(e.target.files[0]));
$("attach-clear").addEventListener("click", clearImage);
$("save-log").addEventListener("click", saveLog);

let resetArmed = null;
$("reset").addEventListener("click", () => {
  const btn = $("reset");
  if (!resetArmed) {
    btn.textContent = "本当に消す？もう一度押す";
    btn.classList.add("warn");
    resetArmed = setTimeout(() => { btn.textContent = "最初からやり直す"; btn.classList.remove("warn"); resetArmed = null; }, 4000);
    return;
  }
  clearTimeout(resetArmed);
  resetArmed = null;
  btn.textContent = "最初からやり直す";
  btn.classList.remove("warn");
  state = { apiMessages: [], view: [], step: 1, classCode: state.classCode, student: state.student, sessionId: newId(), report: "" };
  save();
  renderAll();
});
$("code-gate").addEventListener("submit", (e) => {
  e.preventDefault();
  state.classCode = $("class-code").value.trim();
  save();
  $("code-gate").hidden = true;
});

// ===== 名前の入力 =====
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const x = [...b].map((n) => n.toString(16).padStart(2, "0")).join("");
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}
function renderWho() {
  const st = state.student;
  $("who").textContent = st ? `${st.cluster}-${st.number} ${st.name}` : "名前を入力";
}
function openProfile() {
  const st = state.student || {};
  $("p-cluster").value = st.cluster || "";
  $("p-number").value = st.number || "";
  $("p-name").value = st.name || "";
  $("p-code").value = state.classCode || "";
  $("p-err").hidden = true;
  $("profile-modal").hidden = false;
  setTimeout(() => $(st.cluster ? "p-name" : "p-cluster").focus(), 50);
}
$("profile-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const cluster = $("p-cluster").value.trim().toUpperCase();
  const number = Number($("p-number").value);
  const name = $("p-name").value.trim().replace(/\s+/g, " ");
  let err = "";
  if (!/^[A-Z]{1,2}$/.test(cluster)) err = "クラスターはアルファベットで入力してください（例 B）。";
  else if (!Number.isInteger(number) || number < 1 || number > 99) err = "番号は1〜99の数字で入力してください。";
  else if (!name) err = "名前を入力してください。";
  if (err) {
    $("p-err").textContent = err;
    $("p-err").hidden = false;
    return;
  }
  state.student = { cluster, number, name };
  const code = $("p-code").value.trim();
  if (code) {
    state.classCode = code;
    $("class-code").value = code;
  }
  if (!state.sessionId) state.sessionId = newId();
  save();
  renderWho();
  $("profile-modal").hidden = true;
  $("input").focus();
});
$("who").addEventListener("click", openProfile);

// ===== レポートを Word 形式で作る =====
function plain(text) {
  return text.replace(/\*\*(.+?)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1");
}
function buildReportDoc(md, student) {
  const D = window.docx;
  const font = { ascii: "Yu Gothic", eastAsia: "Yu Gothic", hAnsi: "Yu Gothic" };
  const children = [];
  const lines = md.replace(/\r/g, "").split("\n");
  let titleDone = false;

  const nameBlock = () => [
    new D.Paragraph({
      alignment: D.AlignmentType.RIGHT,
      children: [new D.TextRun({ text: `1年 ${student.cluster}クラスター ${student.number}番　氏名 ${student.name}`, size: 22 })],
    }),
    new D.Paragraph({
      alignment: D.AlignmentType.RIGHT,
      spacing: { after: 240 },
      children: [new D.TextRun({ text: "提出日　　　年　　月　　日", size: 22 })],
    }),
  ];
  const TEXT_W = 11906 - 1134 * 2; // A4の幅から左右の余白を引いた本文の幅（twip）
  const cellBorder = { style: D.BorderStyle.SINGLE, size: 6, color: "8A9A93" };
  const borders = { top: cellBorder, bottom: cellBorder, left: cellBorder, right: cellBorder };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    let m;
    if ((m = /^#\s+(.*)$/.exec(line))) {
      children.push(new D.Paragraph({ heading: D.HeadingLevel.TITLE, alignment: D.AlignmentType.CENTER, children: [new D.TextRun({ text: plain(m[1]), size: 32, bold: true })] }));
      if (!titleDone) { children.push(...nameBlock()); titleDone = true; }
    } else if ((m = /^##\s+(.*)$/.exec(line))) {
      children.push(new D.Paragraph({ heading: D.HeadingLevel.HEADING_1, spacing: { before: 240, after: 80 }, children: [new D.TextRun({ text: plain(m[1]), size: 26, bold: true })] }));
    } else if ((m = /^###\s+(.*)$/.exec(line))) {
      children.push(new D.Paragraph({ heading: D.HeadingLevel.HEADING_2, spacing: { before: 160, after: 60 }, children: [new D.TextRun({ text: plain(m[1]), size: 23, bold: true })] }));
    } else if ((m = /^\[\[記入欄[:：]\s*(.*?)\]\]$/.exec(line))) {
      // 自由記述の枠：ヒントを灰色で書き、下に空行を用意する
      const inner = [new D.Paragraph({ children: [new D.TextRun({ text: "✎ " + plain(m[1]), color: "6B7A74", size: 19 })] })];
      for (let k = 0; k < 5; k++) inner.push(new D.Paragraph({ text: "" }));
      children.push(new D.Table({
        width: { size: TEXT_W, type: D.WidthType.DXA },
        columnWidths: [TEXT_W],
        layout: D.TableLayoutType.FIXED,
        rows: [new D.TableRow({ children: [new D.TableCell({ width: { size: TEXT_W, type: D.WidthType.DXA }, borders, margins: { top: 80, bottom: 80, left: 120, right: 120 }, children: inner })] })],
      }));
      children.push(new D.Paragraph({ text: "" }));
    } else if (line.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        const cells = lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => plain(c.trim()));
        if (!cells.every((c) => /^:?-{2,}:?$/.test(c))) rows.push(cells);
        i++;
      }
      i--;
      const cols = Math.max(...rows.map((r) => r.length));
      const colW = Math.floor(TEXT_W / cols);
      children.push(new D.Table({
        width: { size: colW * cols, type: D.WidthType.DXA },
        columnWidths: Array(cols).fill(colW),
        layout: D.TableLayoutType.FIXED,
        rows: rows.map((r, ri) => new D.TableRow({
          tableHeader: ri === 0,
          children: Array.from({ length: cols }, (_, ci) => new D.TableCell({
            width: { size: colW, type: D.WidthType.DXA },
            borders,
            margins: { top: 40, bottom: 40, left: 100, right: 100 },
            shading: ri === 0 ? { type: D.ShadingType.CLEAR, fill: "E3ECE8", color: "auto" } : undefined,
            children: [new D.Paragraph({ children: [new D.TextRun({ text: r[ci] || "", bold: ri === 0, size: 20 })] })],
          })),
        })),
      }));
      children.push(new D.Paragraph({ text: "" }));
    } else if ((m = /^[-・]\s+(.*)$/.exec(line))) {
      children.push(new D.Paragraph({ bullet: { level: 0 }, children: [new D.TextRun({ text: plain(m[1]) })] }));
    } else {
      children.push(new D.Paragraph({ spacing: { after: 80 }, children: [new D.TextRun({ text: plain(line) })] }));
    }
  }
  if (!titleDone) children.unshift(...nameBlock());

  return new D.Document({
    creator: student.name,
    title: "実験レポート",
    styles: { default: { document: { run: { font, size: 21 } } } },
    sections: [{
      properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, bottom: 1134, left: 1134, right: 1134 } } },
      children,
    }],
  });
}
async function downloadReport(md, btn) {
  if (!state.student) { openProfile(); return; }
  if (!window.docx) {
    showError("レポートを作る部品を読み込めませんでした。ページを再読み込みしてから、もう一度押してください。");
    return;
  }
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "作成中…";
  try {
    const blob = await window.docx.Packer.toBlob(buildReportDoc(md, state.student));
    const st = state.student;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `実験レポート_${st.cluster}${st.number}_${st.name}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch {
    showError("レポートを作れませんでした。もう一度押してください。");
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

load();
if (!state.sessionId) state.sessionId = newId();
$("class-code").value = state.classCode || "";
renderWho();
renderAll();
updateSend();
if (!state.student) openProfile();
</script>
